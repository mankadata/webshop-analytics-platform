<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebShop Pro Analytics</title>
  <meta name="description" content="Build log of a company data warehouse: six source systems, PostgreSQL, dbt staging / intermediate / marts layers, data quality, Airflow and CI.">

  <!-- Fonts: Archivo for headings, Public Sans for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <p class="kicker">Analytics engineering build log</p>
      <h1>WebShop Pro analytics platform</h1>
      <p class="lede">
        How a company data warehouse is built, step by step: from the raw exports of six
        source systems to tested, business-ready tables with dbt.
      </p>
      <a class="repo-link" href="https://github.com/mankadata/webshop-analytics-platform">View the code on GitHub</a>
    </div>
    <!-- Tabs are generated by assets/app.js from the TABS list -->
    <nav class="tabs" aria-label="Build steps">
      <div class="wrap tab-list" id="tabs" role="tablist"></div>
    </nav>
  </header>

  <main class="wrap">
    <!-- The Markdown file of the selected tab is rendered here -->
    <article id="content" class="prose" tabindex="-1" aria-live="polite"></article>
    <nav class="pager" id="pager" aria-label="Previous and next step"></nav>
  </main>

  <footer class="wrap site-footer">
    <p>All data is synthetic. Built by mankadata.</p>
  </footer>

  <!-- marked: Markdown to HTML; mermaid: diagrams written as text -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
