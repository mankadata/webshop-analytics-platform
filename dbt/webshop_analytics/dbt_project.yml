name: webshop_analytics             # project name; must match the key under "models:" below
version: "1.0.0"                    # our own version number for the project
config-version: 2                   # format version of this file (always 2 today)
profile: webshop_analytics          # which profile in profiles.yml holds the connection

# Where dbt looks for each kind of file
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]   # folders deleted by `dbt clean`

# Layers follow the dbt convention. Medallion equivalents in brackets:
#   staging      (bronze) - one model per source table: rename, cast, nothing dropped
#   intermediate (silver) - clean, deduplicate, join, apply business rules
#   marts        (gold)   - business-ready dimensions, facts and reports

models:
  webshop_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table